<div id="data-grid-demo">
    <dx-data-grid id="prgprefix" [columnAutoWidth]="true" [dataSource]="prefixlist" [showBorders]="true" [rowAlternationEnabled]="true" [hoverStateEnabled]="true" (onInitNewRow)="onInsertingstart($event)" (onSaving)="PrefixSave($event)" (onToolbarPreparing)="onToolbarPreparing($event)">
        <dxo-paging [pageSize]="15"></dxo-paging>
        <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 15, 20, 0]" [showInfo]="true"> </dxo-pager>
        <dxo-editing mode="row" [allowUpdating]="true" [allowDeleting]="true" [allowAdding]="true" [useIcons]="true">
            <dxo-popup title="Prefix Info" [showTitle]="true" [position]="{ my: 'top', at: 'top', of: 'window' }">
            </dxo-popup>
        </dxo-editing>


        <dxo-search-panel [visible]="true" [width]="240" placeholder="ค้นหา..."></dxo-search-panel>
        <dxo-scrolling columnRenderingMode="virtual"></dxo-scrolling>
        <dxo-selection mode="single"></dxo-selection>

        <dxi-column dataField="prefixid" caption="*รหัส" sortOrder="asc">
            <dxi-validation-rule type="required" message="กรุณากรอกรหัส"></dxi-validation-rule>
        </dxi-column>
        <dxi-column dataField="prefixname" caption="*คำนำหน้าเต็ม (ไทย)">
            <dxi-validation-rule type="required" message="กรุณากรอกคำนำหน้าเต็ม (ไทย)"></dxi-validation-rule>
        </dxi-column>
        <dxi-column dataField="prefixnameeng" caption="คำนำหน้าเต็ม (อังกฤษ)"></dxi-column>
        <dxi-column dataField="prefixabb" caption="คำนำหน้าย่อ (ไทย)"></dxi-column>
        <dxi-column dataField="prefixabbeng" caption="คำนำหน้าย่อ (อังกฤษ)"></dxi-column>
        <dxi-column dataField="defaultsex" caption="*เพศ">
            <dxi-validation-rule type="required" message="กรุณากรอกเพศ"></dxi-validation-rule>
            <dxo-lookup [dataSource]="sexlist" valueExpr="comboid" displayExpr="comboshow"> </dxo-lookup>
        </dxi-column>
        <dxi-column dataField="prefixtype" caption="*ประเภท">
            <dxi-validation-rule type="required" message="กรุณากรอกประเภท"></dxi-validation-rule>
            <dxo-lookup [dataSource]="prefixtypelist" valueExpr="comboid" displayExpr="comboshow"> </dxo-lookup>
        </dxi-column>

        <div *dxTemplate="let data of 'tableName'">
            <div class="tablelabel">
                <span>คำนำหน้า</span>
                <!-- font-size: 20px; -->
            </div>
        </div>
    </dx-data-grid>
</div>
