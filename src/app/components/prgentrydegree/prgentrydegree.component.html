<div id="data-grid-demo">
    <dx-data-grid id="prgentrydegree" [columnAutoWidth]="true" [dataSource]="entDegreelist" [showBorders]="true" [rowAlternationEnabled]="true" [hoverStateEnabled]="true" (onInitNewRow)="onInsertingstart($event)" (onSaving)="dataSave($event)" (onToolbarPreparing)="onToolbarPreparing($event)">
        <dxo-paging [pageSize]="15"></dxo-paging>
        <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 15, 20, 0]" [showInfo]="true"> </dxo-pager>
        <dxo-editing mode="row" [allowUpdating]="true" [allowDeleting]="true" [allowAdding]="true" [useIcons]="true">
            <dxo-popup title="Entrydegree Info" [showTitle]="true" [position]="{ my: 'top', at: 'top', of: 'window' }">
            </dxo-popup>
        </dxo-editing>

        <dxo-scrolling columnRenderingMode="virtual"></dxo-scrolling>
        <dxo-search-panel [visible]="true" [width]="240" placeholder="ค้นหา..."></dxo-search-panel>
        <dxo-selection mode="single"></dxo-selection>

        <dxi-column dataField="entrydegreecode" caption="*รหัส" [calculateSortValue]="sortString">
            <dxi-validation-rule type="required" message="กรุณากรอกรหัส"></dxi-validation-rule>
        </dxi-column>
        <dxi-column dataField="entrydegreename" caption="*ชื่อคุณวุฒิ (ไทย)">
            <dxi-validation-rule type="required" message="กรุณากรอกชื่อคุณวุฒิ (ไทย)"></dxi-validation-rule>
        </dxi-column>
        <dxi-column dataField="entrydegreenameeng" caption="ชื่อคุณวุฒิ (อังกฤษ)"> </dxi-column>
        <dxi-column dataField="entrydegreeabb" caption="ชื่อย่อคุณวุฒิ (ไทย)"> </dxi-column>
        <dxi-column dataField="entrydegreeabbeng" caption="ชื่อย่อคุณวุฒิ (อังกฤษ)"> </dxi-column>
        <dxi-column dataField="isec" caption="ISEC"> </dxi-column>

        <div *dxTemplate="let data of 'tableName'">
            <div class="tablelabel">
                <span>คุณวุฒิ</span>
            </div>
        </div>
    </dx-data-grid>
</div>
