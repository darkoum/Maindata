<div class="row">
    <div class="col-2">
        รหัสนักศึกษา
        <dx-text-box [(ngModel)]="studentcode" [showClearButton]="true" placeholder="การค้นหาบางส่วนใช้ *">
        </dx-text-box>
    </div>
    <div class="col-2">
        ชื่อ
        <dx-text-box [(ngModel)]="studentname" [showClearButton]="true" placeholder="การค้นหาบางส่วนใช้ *">
        </dx-text-box>
    </div>
    <div class="col-2">
        นามสกุล
        <dx-text-box [(ngModel)]="studentsurname" [showClearButton]="true"
            placeholder="การค้นหาบางส่วนใช้ *">
        </dx-text-box>
    </div>
    <div class="col-2">
        เลขประจำตัวประชาชน
        <dx-text-box [(ngModel)]="citizenid" [showClearButton]="true"> </dx-text-box>
    </div>
    <div class="col-2">
        สถานะนักศึกษา
        <dx-select-box [dataSource]="studentstatuslist" [(ngModel)]="studentstatus" displayExpr="comboshow" searchMode="StartsWith" valueExpr="comboid" [searchEnabled]="true" [showClearButton]="true" ></dx-select-box>
    </div>
    <div class="col-2">
        ระดับ
        <dx-select-box [dataSource]="levlist" [(ngModel)]="levelid" (onValueChanged)="getprogram();refreshGroupyear();" displayExpr="comboshow" searchMode="StartsWith" valueExpr="comboid" [searchEnabled]="true" [showClearButton]="true" ></dx-select-box>
    </div>
    <div class="col-2">
        วิทยาลัย/คณะ/สถาบัน
        <dx-select-box [dataSource]="faclist" [(ngModel)]="facultyid" (onValueChanged)="getdepartment();getprogram();refreshGroupyear();" displayExpr="comboshow" searchMode="StartsWith" valueExpr="comboid" [searchEnabled]="true" [showClearButton]="true" ></dx-select-box>
    </div>
     <div class="col-2">
        ภาค/สาขา
        <dx-select-box [dataSource]="departmentlist" [(ngModel)]="departmentid" (onValueChanged)="getprogram();refreshGroupyear();" displayExpr="comboshow" searchMode="StartsWith" valueExpr="comboid" [searchEnabled]="true" [showClearButton]="true" ></dx-select-box>
    </div>
    <div class="col-2">
        สาขาวิชา
        <dx-select-box [dataSource]="programlist" (onValueChanged)="refreshGroupyear();" displayExpr="comboshow" valueExpr="comboid"
            [searchEnabled]="true" [showClearButton]="true" [(ngModel)]="programid">
        </dx-select-box>
    </div> 
    <div class="col-1">
        รุ่น
        <dx-number-box [(ngModel)]="groupyear" [showClearButton]="true" [showSpinButtons]="false"
            (onValueChanged)="refreshGroupyear()">
        </dx-number-box>
    </div>
    <div class="col-3">
        กลุ่มนักศึกษา
        <dx-select-box [dataSource]="studentgrouplist" displayExpr="comboshow" searchMode="StartsWith"
            valueExpr="comboid" [searchEnabled]="true" [showClearButton]="true" [(ngModel)]="studentgroup">
        </dx-select-box>
    </div>
    <div class="col-2">
        <br />
        <dx-button class="button" (onClick)="getstu()" icon="find" type="default" text="ค้นหา" width="100%"></dx-button>
    </div>
</div>
<div id="data-grid-demo" class="pt-3">
    <dx-data-grid id="prgstudentmaster" #stumas [columnAutoWidth]="true" [allowColumnReordering]="true"
        [allowColumnResizing]="true" [repaintChangesOnly]="true" (onSaving)="stuSave($event)"
        (onEditingStart)="onEditstart($event)" (onSelectionChanged)="selectionChanged($event)"
        (onEditCanceling)="onCancelEditmode()" [rowAlternationEnabled]="true" [hoverStateEnabled]="true"
        [showBorders]="true" [dataSource]="stulist" [columnHidingEnabled]="false" (onEditorPreparing)="onEditorPreparing($event)"
        >
        <dxo-paging [pageSize]="15"></dxo-paging>
        <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[15, 20, 25]" [showInfo]="true"> </dxo-pager>
        <dxo-column-fixing [enabled]="true"></dxo-column-fixing>
        <dxo-scrolling columnRenderingMode="virtual"></dxo-scrolling>
        <dxo-selection mode="single"></dxo-selection>
        <dxo-editing mode="popup" [allowUpdating]="true" [allowDeleting]="false" [useIcons]="true">
            <dxo-popup title="ระเบียนนักศึกษา" [showTitle]="true" >
                <!-- [position]="{ my: 'top', at: 'top', of: 'window' }" [height]="'95%'" -->
            </dxo-popup>
            <dxo-form>
                <dxi-item itemType="tabbed" [colSpan]="2">
                    <dxo-tab-panel-options [deferRendering]="true"> </dxo-tab-panel-options>
                    <dxi-tab title="ข้อมูลนักศึกษา" icon="user" >
                        <dxi-item itemType="group" caption="ข้อมูลนักศึกษา" >
                            <dxi-item itemType="group" [colCount]="12" [colSpan]="12" cssClass="colorLabel">
                                <dxi-item dataField="studentcode" [label]="{ text: 'รหัสนักศึกษา' }"
                                    [colSpan]="4">
                                    <dxi-validation-rule type="required"
                                        message="กรุณากรอกรหัสนักศึกษา"></dxi-validation-rule>
                                </dxi-item>
                            </dxi-item>
                            <dxi-item itemType="group" [colCount]="12" [colSpan]="4" cssClass="colorLabel">
                                <dxi-item dataField="prefixid" [label]="{ text: 'คำนำหน้า' }" [colSpan]="4">
                                    <dxi-validation-rule type="required"
                                        message="กรุณากรอกคำนำหน้า"></dxi-validation-rule>
                                </dxi-item>
                                <dxi-item dataField="studentname" [label]="{ text: 'ชื่อ (ไทย)' }"
                                    editorType="dxTextBox" [editorOptions]="{ maxLength: 100}" [colSpan]="4">
                                    <dxi-validation-rule type="required"
                                        message="กรุณากรอกชื่อ (ไทย)"></dxi-validation-rule>
                                </dxi-item>
                                <dxi-item dataField="studentsurname" [label]="{ text: 'นามสกุล (ไทย)' }"
                                    editorType="dxTextBox" [editorOptions]="{ maxLength: 100}" [colSpan]="4">
                                    <dxi-validation-rule type="required"
                                        message="กรุณากรอกนามสกุล (ไทย)"></dxi-validation-rule>
                                </dxi-item>
                                <dxi-item [colSpan]="4">
                                </dxi-item>
                                <dxi-item dataField="studentnameeng" [label]="{ text: 'ชื่อ (อังกฤษ)' }"
                                    editorType="dxTextBox" [editorOptions]="{ maxLength: 100}" [colSpan]="4"></dxi-item>
                                <dxi-item dataField="studentsurnameeng" [label]="{ text: 'นามสกุล (อังกฤษ)' }"
                                    editorType="dxTextBox" [editorOptions]="{ maxLength: 100}" [colSpan]="4"></dxi-item>
                            </dxi-item>
                            <dxi-item itemType="group" [colCount]="12" cssClass="colorLabel">
                                <dxi-item dataField="studentstatus" [label]="{ text: 'สถานภาพ' }"
                                    [editorOptions]="{ readOnly: true }" [colSpan]="6">
                                </dxi-item>
                                <dxi-item dataField="campusid" [label]="{ text: 'ศูนย์/วิทยาเขต' }"
                                    [editorOptions]="{ readOnly: true }" [colSpan]="6">
                                    <dxi-validation-rule type="required"
                                        message="กรุณากรอกศูนย์/วิทยาเขต"></dxi-validation-rule>
                                </dxi-item>
                                <dxi-item dataField="levelid" [label]="{ text: 'ระดับ' }"
                                    [editorOptions]="{ readOnly: true }" [colSpan]="6">
                                </dxi-item>
                                <dxi-item dataField="facultyid" [label]="{ text: 'วิทยาลัย/คณะ/สถาบัน' }"
                                    [editorOptions]="{ readOnly: true }" [colSpan]="6">
                                </dxi-item>
                                <dxi-item dataField="departmentid" [label]="{ text: 'ภาค/สาขา' }"
                                    [editorOptions]="{ readOnly: true }" [colSpan]="6">
                                </dxi-item>
                                <dxi-item dataField="minorprogramid" [label]="{ text: 'โท' }"
                                    [colSpan]="6">
                                </dxi-item>
                                <dxi-item dataField="programid" [label]="{ text: 'สาขาวิชา' }"
                                    [editorOptions]="{ readOnly: true }" [colSpan]="6">
                                    <dxi-validation-rule type="required"
                                        message="กรุณากรอกหลักสูตร"></dxi-validation-rule>
                                </dxi-item>
                                <dxi-item dataField="graduateprogramid" [label]="{ text: 'หลักสูตรตรวจจบ' }"
                                    [colSpan]="6"></dxi-item>
                            </dxi-item>
                            <!-- <dxi-item itemType="group" [colCount]="12" [colSpan]="1" cssClass="colorLabel"> -->
                            <dxi-item itemType="group" [colCount]="12" [colSpan]="2" cssClass="colorLabel">
                                <dxi-item itemType="group" [colCount]="6" [colSpan]="4" cssClass="colorLabel">
                                    <dxi-item dataField="admitacadyear" [label]="{ text: 'ปีที่เข้า' }" [colSpan]="4">
                                        <dxi-validation-rule type="required"
                                            message="กรุณากรอกปีที่เข้า"></dxi-validation-rule>
                                    </dxi-item>
                                    <dxi-item dataField="admitsemester" [label]="{ text: 'ภาคที่เข้า' }" [colSpan]="2">
                                        <dxi-validation-rule type="required"
                                            message="กรุณากรอกภาคที่"></dxi-validation-rule>
                                    </dxi-item>
                                </dxi-item>
                                
                                <dxi-item dataField="groupyear" [label]="{ text: 'รุ่นปี' }" [colSpan]="2">
                                    <dxi-validation-rule type="required"
                                        message="กรุณากรอกปีที่เข้า"></dxi-validation-rule>
                                </dxi-item>
                                <dxi-item dataField="studentgroup" [label]="{ text: 'กลุ่มนักศึกษา' }" [colSpan]="6">
                                    <dxi-validation-rule type="required"
                                        message="กรุณากรอกกลุ่มนักศึกษา"></dxi-validation-rule>
                                </dxi-item>
                               
                            </dxi-item>
                            <!-- <dxi-item itemType="group" [colCount]="12" [colSpan]="6" cssClass="colorLabel"> -->
                            <dxi-item itemType="group" [colCount]="12" cssClass="colorLabel">
                                 <dxi-item dataField="webflag" [label]="{ text: 'สิทธิ์ใช้ระบบ' }" [colSpan]="6">
                                    <dxi-validation-rule type="required"
                                        message="กรุณากรอกสิทธิ์ใช้ระบบ"></dxi-validation-rule>
                                </dxi-item>
                                <dxi-item dataField="acadid" [label]="{ text: 'การประเมินผล' }" [colSpan]="6">
                                    <dxi-validation-rule type="required"
                                        message="กรุณากรอกการประเมินผล"></dxi-validation-rule>
                                </dxi-item>
                            </dxi-item>
                            <dxi-item itemType="group" [colCount]="12" cssClass="colorLabel">
                                <dxi-item dataField="feegroupid" [label]="{ text: 'บัญชีค่าใช้จ่าย' }" [colSpan]="6">
                                    <dxi-validation-rule type="required"
                                        message="กรุณากรอกบัญชีค่าใช้จ่าย"></dxi-validation-rule>
                                </dxi-item>
                                <dxi-item dataField="schedulegroupid" [label]="{ text: 'ปฎิทิน' }" [colSpan]="6">
                                    <dxi-validation-rule type="required"
                                        message="กรุณากรอกปฎิทิน"></dxi-validation-rule>
                                </dxi-item>
                            </dxi-item>
                            <dxi-item itemType="group" [colCount]="32" cssClass="colorLabel">
                                <dxi-item dataField="admitdate" [label]="{ text: 'วันที่รับเข้า' } "
                                    [colSpan]="8"></dxi-item>
                                <dxi-item dataField="finishdate" [label]="{ text: 'วันที่จบ/พ้นสภาพ' }"
                                    [colSpan]="8"></dxi-item>
                                <dxi-item dataField="studentyear" [editorOptions]="{ readOnly: true }" [label]="{ text: 'ชั้นปี' }" [colSpan]="8"></dxi-item>
                                <dxi-item dataField="gpa" [label]="{ text: 'GPA' }" [colSpan]="8"
                                    [editorOptions]="{readOnly: true, format: { type: 'fixedPoint', precision: 2 }}"></dxi-item>
                            </dxi-item>
                            <dxi-item itemType="group" [colCount]="32" cssClass="colorLabel">
                                <dxi-item dataField="creditattempt" [editorOptions]="{ readOnly: true }" [label]="{ text: 'หน่วยกิตลงแล้ว' }"
                                    [colSpan]="8"></dxi-item>
                                <dxi-item dataField="creditsatisfy" [editorOptions]="{ readOnly: true }" [label]="{ text: 'หน่วยกิตได้รับ' }"
                                    [colSpan]="8"></dxi-item>
                                <dxi-item dataField="creditpoint" [editorOptions]="{ readOnly: true }" [label]="{ text: 'หน่วยกิตคะแนน' }"
                                    [colSpan]="8"></dxi-item>
                                <dxi-item dataField="gradepoint" [editorOptions]="{ readOnly: true }" [label]="{ text: 'จำนวนคะแนน' }"
                                    [colSpan]="8"></dxi-item>
                            </dxi-item>
                            <dxi-item itemType="group" [colCount]="24" cssClass="colorLabel">
                                <dxi-item dataField="officerid" [label]="{ text: 'อาจารย์ที่ปรึกษา1' }"
                                [colSpan]="8"></dxi-item>
                                <dxi-item dataField="officerid2" [label]="{ text: 'อาจารย์ที่ปรึกษา2' }"
                                [colSpan]="8"></dxi-item>
                                <dxi-item dataField="officerid3" [label]="{ text: 'อาจารย์ที่ปรึกษา3' }"
                                [colSpan]="8"></dxi-item>
                            </dxi-item>
                            <dxi-item itemType="group" [colCount]="24" cssClass="colorLabel">
                                <dxi-item dataField="officerid4" [label]="{ text: 'อาจารย์ที่ปรึกษา4' }"
                                [colSpan]="8"></dxi-item>
                                <dxi-item dataField="officerid5" [label]="{ text: 'อาจารย์ที่ปรึกษา5' }"
                                [colSpan]="8"></dxi-item>
                                <dxi-item dataField="documentstatus" [label]="{ text: 'สถานะเอกสาร' }"
                                [colSpan]="8"></dxi-item>
                            </dxi-item>
                        </dxi-item>
                    </dxi-tab>
                    <dxi-tab title="ข้อมูลส่วนบุคคล">
                        <dxi-item itemType="group" caption="ข้อมูลส่วนบุคคล">
                            <dxi-item itemType="group" [colCount]="2" [colSpan]="2" cssClass="colorLabel">
                                <dxi-item dataField="birthdate" [label]="{ text: 'วัน เดือน ปีเกิด' }"></dxi-item>
                                <dxi-item dataField="birthyear" [label]="{ text: 'ปี พ.ศ. เกิด ' }"
                                    helpText="(กรณีไม่มีวันเกิด)">
                                </dxi-item>
                                <dxi-item dataField="birthprovinceid"
                                    [label]="{ text: 'ภูมิลำเนาเดิม (จังหวัด)' }"></dxi-item>
                                <dxi-item dataField="originid" [label]="{ text: 'เชื้อชาติ' }"></dxi-item>
                                <dxi-item dataField="nationid" [label]="{ text: 'สัญชาติ' }"></dxi-item>
                                <dxi-item dataField="religionid" [label]="{ text: 'ศาสนา' }"></dxi-item>
                                <dxi-item dataField="bloodgroup" [label]="{ text: 'หมู่โลหิต' }"></dxi-item>
                                <dxi-item dataField="foodallergies" [label]="{ text: 'ประวัติการแพ้อาหาร/ยา' }"></dxi-item>
                            </dxi-item>
                        </dxi-item>
                        <dxi-item itemType="group" caption="ข้อมูลหนังสือเดินทางและวีซ่า">
                            <dxi-item itemType="group" [colCount]="2" [colSpan]="2" cssClass="colorLabel">
                                <dxi-item dataField="citizenid"
                                    [label]="{ text: 'เลขประจำตัวประชาชน/เลขที่หนังสือเดินทาง' }" [editorOptions]="citizeneditorOptions">
                                </dxi-item>
                                <!-- <dxi-item dataField="citizenid_foreigner"
                                    [label]="{ text: 'รหัสประจำตัวต่างชาติ (GCODE)' }">
                                </dxi-item> -->
                                <dxi-item dataField="passportstartdate" [label]="{ text: 'วันที่ออก Passport' }"></dxi-item>
                                <dxi-item dataField="passportenddate" [label]="{ text: 'วันที่หมดอายุ Passport' }"></dxi-item>
                                <dxi-item dataField="visastartdate" [label]="{ text: 'วันที่ออก Visa' }"></dxi-item>
                                <dxi-item dataField="visaexpire" [label]="{ text: 'วันที่หมดอายุ Visa' }"></dxi-item>
                                <dxi-item dataField="visatype" [label]="{ text: 'ประเภท Visa' }"></dxi-item>
                            </dxi-item>
                        </dxi-item>
                        <dxi-item itemType="group" caption="ข้อมูลความพิการ">
                            <dxi-item itemType="group" [colCount]="2" [colSpan]="2" cssClass="colorLabel">
                                <dxi-item dataField="deformcode" [label]="{ text: 'รหัสความพิการ' }"></dxi-item>
                                <dxi-item dataField="deformcard_id" [label]="{ text: 'รหัสบัตรประจำตัวคนพิการ' }"
                                    [editorOptions]="{ maxLength: 32}"></dxi-item>
                                <dxi-item dataField="deformcard_startdate" [label]="{ text: 'วันที่ออกบัตร' }"></dxi-item>
                                <dxi-item dataField="deformcard_enddate" [label]="{ text: 'วันหมดอายุ' }"></dxi-item>
                            </dxi-item>
                        </dxi-item>
                        <dxi-item itemType="group" caption="ข้อมูลการศึกษาเดิม">
                            <dxi-item itemType="group" [colCount]="2" [colSpan]="2" cssClass="colorLabel">
                                <dxi-item dataField="schoolid" [label]="{ text: 'ชื่อสถานศึกษาเดิม' }">
                                </dxi-item>
                                <dxi-item dataField="entrydegree" [label]="{ text: ' วุฒิเดิม' }"></dxi-item>
                                <dxi-item dataField="entrygraduatedate" [label]="{ text: 'วันที่สำเร็จ' }"></dxi-item>
                                <dxi-item dataField="graduatecheck" [label]="{ text: 'สถานะตรวจสอบวุฒิ'}"></dxi-item>
                                <dxi-item dataField="entrytype" [label]="{ text: 'ประเภทรับเข้า'}"
                                    [colSpan]="2"></dxi-item>
                            </dxi-item>
                        </dxi-item>

                    </dxi-tab>
                    <dxi-tab title=" ข้อมูลที่อยู่">
                        <dxi-item itemType="group" caption="ที่อยู่ตามสำเนาทะเบียนบ้าน">
                            <dxi-item itemType="group" [colCount]="2" [colSpan]="2" cssClass="colorLabel">
                                <dxi-item dataField="homeid" [label]="{ text: 'รหัสประจำบ้าน' }" editorType="dxTextBox"
                                    [editorOptions]="{ maxLength: 11}"></dxi-item>
                                <!-- <dxi-item dataField="homeadd" [label]="{ text: 'หมู่' }" editorType="dxTextBox"
                                    [editorOptions]="{ maxLength: 50}"></dxi-item> -->
                                <dxi-item dataField="homeadd" [label]="{ text: 'บ้านเลขที่' }"
                                    editorType="dxTextBox" [editorOptions]="{ maxLength: 50}"></dxi-item>
                                <!-- <dxi-item dataField="homeaddress2" [label]="{ text: 'บ้านเลขที่ 2' }"
                                    editorType="dxTextBox" [editorOptions]="{ maxLength: 50}"></dxi-item> -->
                                <dxi-item dataField="homemoo" [label]="{ text: 'หมู่' }" editorType="dxTextBox"
                                    [editorOptions]="{ maxLength: 50}"></dxi-item>
                                <dxi-item dataField="homesoi" [label]="{ text: 'ตรอก/ซอย' }" editorType="dxTextBox"
                                    [editorOptions]="{ maxLength: 100}"></dxi-item>
                                <dxi-item dataField="homestreet" [label]="{ text: 'ถนน' }" editorType="dxTextBox"
                                    [editorOptions]="{ maxLength: 100}"></dxi-item>
                                <dxi-item dataField="homeprovinceid" [label]="{ text: 'จังหวัด' }"></dxi-item>
                                <dxi-item dataField="homedistrict" [label]="{ text: 'เขต/อำเภอ' }"></dxi-item>
                                <dxi-item dataField="homesubdistrict" [label]="{ text: 'แขวง/ตำบล' }"></dxi-item>
                                <dxi-item dataField="homezipcode" [label]="{ text: 'รหัสไปรษณีย์' }"
                                    editorType="dxTextBox" [editorOptions]="{ maxLength: 8}"></dxi-item>
                                <dxi-item dataField="homephoneno" [label]="{ text: 'โทรศัพท์' }"
                                    editorType="dxTextBox" [editorOptions]="phoneeditorOptions"></dxi-item>
                                <dxi-item dataField="studentemail" [label]="{ text: 'อีเมล' }" editorType="dxTextBox"
                                    [editorOptions]="{ maxLength: 50}"></dxi-item>

                            </dxi-item>
                        </dxi-item>
                        <dxi-item itemType="group" caption="ที่อยู่ปัจจุบัน">
                            <dxi-item itemType="group" [colCount]="2" [colSpan]="2" cssClass="colorLabel">
                                <dxi-item dataField="currentadd" [label]="{ text: 'บ้านเลขที่' }"
                                    editorType="dxTextBox" [editorOptions]="{ maxLength: 50}"></dxi-item>
                                <!-- <dxi-item dataField="currentaddress2" [label]="{ text: 'บ้านเลขที่ 2' }"
                                    editorType="dxTextBox" [editorOptions]="{ maxLength: 50}"></dxi-item> -->
                                <dxi-item dataField="currentmoo" [label]="{ text: 'หมู่' }" editorType="dxTextBox"
                                    [editorOptions]="{ maxLength: 50}"></dxi-item>
                                <dxi-item dataField="currentsoi" [label]="{ text: 'ตรอก/ซอย' }" editorType="dxTextBox"
                                    [editorOptions]="{ maxLength: 100}"></dxi-item>
