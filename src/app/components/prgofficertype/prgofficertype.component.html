<div class="row">
    <div class="col-12">
        <div id="data-grid-demo">
            <dx-data-grid id="prgofficertype" (onInitNewRow)="getDefault($event)" (onSelectionChanged)="selectionChanged($event)" (onSaving)="offtypeSave($event)" (onEditCanceling)="onCancelEditmode()" [rowAlternationEnabled]="true" [hoverStateEnabled]="true" [showBorders]="true"
                [allowColumnResizing]="true" [columnHidingEnabled]="true" [dataSource]="officertypelist">
                <dxo-paging [pageSize]="15"></dxo-paging>
                <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 15, 20, 0]" [showInfo]="true"> </dxo-pager>
                <dxo-editing mode="single" [allowUpdating]="true" [allowDeleting]="true" [allowAdding]="true" [useIcons]="true">
                    <dxo-popup title="Question Info" [showTitle]="true" [position]="{ my: 'top', at: 'top', of: 'window' }">
                    </dxo-popup>
                </dxo-editing>
                <dxo-scrolling columnRenderingMode="virtual"></dxo-scrolling>
                <dxo-search-panel [visible]="true" [width]="240" placeholder="ค้นหา..."></dxo-search-panel>
                <dxo-selection mode="single"></dxo-selection>
                <dxi-column dataField="bytecode" caption="*รหัส" [width]="120">
                    <dxi-validation-rule type="required" message="กรุณากรอกรหัส"></dxi-validation-rule>
                </dxi-column>
                <dxi-column dataField="bytedes" caption="*คำอธิบาย">
                    <dxi-validation-rule type="required" message="กรุณากรอกคำอธิบาย"></dxi-validation-rule>
                </dxi-column>
                <dxi-column dataField="groupofflist" caption="*กลุ่ม" dis [allowEditing]="false">
                </dxi-column>
            </dx-data-grid>
            <br />

            <dx-popup [width]="200" [height]="150" [showTitle]="true" title="Message" [dragEnabled]="false" [hideOnOutsideClick]="true" [(visible)]="popupVisible">
                <div style="text-align: center">
                    {{ notification }}
                </div>
            </dx-popup>
        </div>
    </div>
</div>
