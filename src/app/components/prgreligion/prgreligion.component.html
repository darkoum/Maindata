<div id="data-grid-demo">
    <dx-data-grid id="prgreligion" [columnAutoWidth]="true" [dataSource]="religionlist" [showBorders]="true" [rowAlternationEnabled]="true" [hoverStateEnabled]="true" (onSaving)="ReligionidSave($event)" (onToolbarPreparing)="onToolbarPreparing($event)" (onInitNewRow)="onInsertingstart($event)">
        <dxo-paging [pageSize]="15"></dxo-paging>
        <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 15, 20, 0]" [showInfo]="true"> </dxo-pager>
        <dxo-editing mode="row" [allowUpdating]="true" [allowDeleting]="true" [allowAdding]="true" [useIcons]="true">
            <dxo-popup title="Origin Info" [showTitle]="true" [position]="{ my: 'top', at: 'top', of: 'window' }">
            </dxo-popup>
        </dxo-editing>

        <dxo-scrolling columnRenderingMode="virtual"></dxo-scrolling>
        <dxo-search-panel [visible]="true" [width]="240" placeholder="Search..."></dxo-search-panel>
        <dxo-selection mode="single"></dxo-selection>

        <dxi-column dataField="religionid" caption="*รหัส" sortOrder="asc" [width]="10 + '%'">
            <dxi-validation-rule type="required" message="กรุณากรอกรหัส"></dxi-validation-rule>
        </dxi-column>
        <dxi-column dataField="religionname" caption="*ชื่อศาสนา (ไทย)">
            <dxi-validation-rule type="required" message="กรุณากรอชื่อศาสนา (ไทย)"></dxi-validation-rule>
        </dxi-column>
        <dxi-column dataField="religionnameeng" caption="ชื่อศาสนา (อังกฤษ)">

        </dxi-column>
        <div *dxTemplate="let data of 'tableName'">
            <div class="tablelabel">
                <span>ศาสนา</span>
            </div>
        </div>
    </dx-data-grid>
</div>
