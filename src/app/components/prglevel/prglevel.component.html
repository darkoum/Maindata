<div id="data-grid-demo">
    <dx-data-grid id="prglevelid" [columnAutoWidth]="true" (onInitNewRow)="getDefault($event)" (onSaving)="levSave($event)" [allowColumnReordering]="true" [allowColumnResizing]="true" [rowAlternationEnabled]="true" [hoverStateEnabled]="true" [showBorders]="true"
        [dataSource]="levelidlist" [columnHidingEnabled]="true">
        <dxo-paging [pageSize]="15"></dxo-paging>

        <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 15, 20,0]" [showInfo]="true"> </dxo-pager>
        <dxo-editing mode="popup" [allowUpdating]="true" [allowDeleting]="true" [allowAdding]="true" [useIcons]="true">
            <dxo-popup title="ระดับที่เปิดสอน" [showTitle]="true" [height]="'auto'">
            </dxo-popup>

            <dxo-form>
                <dxi-item itemType="group" [colCount]="2" [colSpan]="2">
                    <dxi-item dataField="levelid" [label]="{ text: 'รหัส' }"></dxi-item>


                </dxi-item>
                <dxi-item itemType="group" [colCount]="2" [colSpan]="2">

                    <dxi-item dataField="levelname" [colSpan]="2" [label]="{ text: 'ชื่อระดับ (ไทย)' }"></dxi-item>
                    <dxi-item dataField="levelnameeng" [colSpan]="2" [label]="{ text: 'ชื่อระดับ (อังกฤษ)' }"></dxi-item>
                    <dxi-item dataField="levelabb"></dxi-item>
                    <dxi-item dataField="levelabbeng"></dxi-item>
                    <dxi-item dataField="divisioncode" [label]="{ text: 'ประเภทนักศึกษา' }"></dxi-item>
                    <dxi-item dataField="levelcode" [label]="{ text: 'ระดับ' }"></dxi-item>
                    <!-- <dxi-item dataField="levelgroup"></dxi-item> -->
                    <!-- <dxi-item dataField="webstatus"></dxi-item> -->
                    <dxi-item dataField="ftesbase"></dxi-item>
                    <dxi-item dataField="statusflag"></dxi-item>
                    <!--     <dxi-item dataField="levelstatus"></dxi-item> -->

                </dxi-item>

            </dxo-form>
        </dxo-editing>
        <dxo-search-panel [visible]="true" [width]="240" placeholder="ค้นหา..."></dxo-search-panel>
        <dxo-scrolling columnRenderingMode="virtual"></dxo-scrolling>
        <dxo-selection mode="single"></dxo-selection>
        <dxi-column dataField="levelid" caption="*รหัส" sortOrder="asc" [width]="100">
            <dxi-validation-rule type="required" message="กรุณากรอกรหัส"></dxi-validation-rule>
        </dxi-column>
        <dxi-column dataField="levelname" caption="*ชื่อระดับ (ไทย)">
            <dxi-validation-rule type="required" message="กรุณากรอกชื่อระดับ (ไทย)"></dxi-validation-rule>
        </dxi-column>
        <dxi-column dataField="levelnameeng" caption="ชื่อระดับ (อังกฤษ)"></dxi-column>
        <dxi-column dataField="divisioncode" caption="*ประเภทนักศึกษา">
            <dxo-lookup [dataSource]="divisioncodelist" valueExpr="comboid" displayExpr="comboshow">
            </dxo-lookup>
            <dxi-validation-rule type="required" message="กรุณากรอกประเภทนักศึกษา"></dxi-validation-rule>
        </dxi-column>
        <!-- <dxi-column dataField="levelgroup" caption="ประเภทระดับ" [visible]="false">
            <dxo-lookup [dataSource]="levelgrouplist" valueExpr="comboid" displayExpr="comboshow"> </dxo-lookup>
            <dxi-validation-rule type="required" message="กรุณากรอกกลุ่มระดับ"></dxi-validation-rule>
        </dxi-column> -->
        <dxi-column dataField="levelcode" caption="*ระดับ">
            <dxo-lookup [dataSource]="levelcodelist" valueExpr="comboid" displayExpr="comboshow"> </dxo-lookup>
            <dxi-validation-rule type="required" message="กรุณากรอกระดับ"></dxi-validation-rule>
        </dxi-column>
        <!-- <dxi-column dataField="webstatus" caption="แสดง Web" [visible]="true">
            <dxo-lookup [dataSource]="flagweb" valueExpr="key" displayExpr="value"> </dxo-lookup>
            <dxi-validation-rule type="required" message="กรุณากรอกแสดง Web"></dxi-validation-rule>
        </dxi-column> -->

        <dxi-column dataField="statusflag" caption="สถานะใช้งาน" [width]="100">
            <dxi-validation-rule type="required" message="กรุณากรอกสถานะใช้งาน"></dxi-validation-rule>
            <dxo-lookup [dataSource]="statusflaglist" valueExpr="comboid" displayExpr="comboshow" showClearButton="true">
            </dxo-lookup>
        </dxi-column>

        <dxi-column [visible]="false" dataField="levelabb" caption="ชื่อย่อ"></dxi-column>
        <dxi-column [visible]="false" dataField="levelabbeng" caption="ชื่อย่อ (อังกฤษ)"></dxi-column>
        <dxi-column [visible]="false" dataField="ftesbase" caption="FTESBASE"></dxi-column>
        <!-- <dxi-column dataField="levelstatus" caption="สถานะ">
            <dxo-lookup [dataSource]="levelstatus" valueExpr="comboid" displayExpr="comboshow"> </dxo-lookup>
        </dxi-column> -->
    </dx-data-grid>





</div>
